name: 原生构建与打包

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Windows 原生安装包
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缓存固定 Qt 6.12 开发包
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt-sdk-cache
          key: qt612-msvc-${{ hashFiles('native/qt-sdk.json') }}
      - name: 安装固定版本 Qt
        shell: pwsh
        run: |
          python -m pip install py7zr==1.1.4
          python -B native/install_qt.py --output "$env:RUNNER_TEMP/qt612" --cache "$env:RUNNER_TEMP/qt-sdk-cache"
          if ($LASTEXITCODE) { throw 'Qt 开发包校验或解压失败' }
          "QT_ROOT_DIR=$env:RUNNER_TEMP/qt612" >> $env:GITHUB_ENV
      - name: 检查标签并编译
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
            throw '标签与插件版本不一致'
          }
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_ROOT=$vsRoot" >> $env:GITHUB_ENV
          .\native\build.ps1 -QtRoot $env:QT_ROOT_DIR -VsRoot $vsRoot -Output "$env:RUNNER_TEMP\native-build"
      - name: 打包共享 Qt 插件
        shell: pwsh
        run: |
          python -B native/package.py --build "$env:RUNNER_TEMP\native-build" --vs-root "$env:VS_ROOT"
          if ($LASTEXITCODE) { throw '打包失败' }
      - name: 保留安装包、校验值与开发验证程序
        uses: actions/upload-artifact@v4
        with:
          name: 截图翻译原生包
          if-no-files-found: error
          path: |
            dist/release-*/*.wsplugin
            dist/release-*/*.bin
            dist/release-*/*.sha256
            dist/release-*/package.json
            ${{ runner.temp }}/native-build/native_tests.exe
      - name: 构建摘要
        shell: pwsh
        run: |
          $report = Get-Content (Get-ChildItem dist/release-*/package.json | Select-Object -First 1).FullName -Raw | ConvertFrom-Json
          "源码提交：$($report.sourceCommit)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256：$($report.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "安装包已生成；下载构建产物并完成独立桌面验证后，再发布正式 Release。旧版附件不会覆盖。" >> $env:GITHUB_STEP_SUMMARY
