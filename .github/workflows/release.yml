name: 原生构建与打包

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Windows 原生安装包
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缓存固定 Qt 6.12 开发包
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt-sdk-cache
          key: qt612-msvc-${{ hashFiles('native/qt-sdk.json') }}
      - name: 安装固定版本 Qt
        shell: pwsh
        run: |
          python -m pip install py7zr==1.1.4
          python -B native/install_qt.py --output "$env:RUNNER_TEMP/qt612" --cache "$env:RUNNER_TEMP/qt-sdk-cache"
          if ($LASTEXITCODE) { throw 'Qt 开发包校验或解压失败' }
          "QT_ROOT_DIR=$env:RUNNER_TEMP/qt612" >> $env:GITHUB_ENV
      - name: 检查标签并编译
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content plugin.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
            throw '标签与插件版本不一致'
          }
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "VS_ROOT=$vsRoot" >> $env:GITHUB_ENV
          .\native\build.ps1 -QtRoot $env:QT_ROOT_DIR -VsRoot $vsRoot -Output "$env:RUNNER_TEMP\native-build"
      - name: 打包共享 Qt 插件
        id: package
        shell: pwsh
        run: |
          python -B native/package.py --build "$env:RUNNER_TEMP\native-build" --vs-root "$env:VS_ROOT"
          if ($LASTEXITCODE) { throw '打包失败' }
      - name: 验证真实复制、剪贴板还原与取消
        shell: pwsh
        run: |
          python -X utf8 -B native/test_selection_release.py --build "$env:RUNNER_TEMP\native-build" --qt-root "$env:QT_ROOT_DIR" --output .test-output/selection-release
          if ($LASTEXITCODE) { throw '真实复制发布验证失败，不允许将回退测试算作通过' }
      - name: 安装 Firefox 测试依赖
        shell: pwsh
        run: |
          python -m pip install requests
          $driver = Invoke-RestMethod https://api.github.com/repos/mozilla/geckodriver/releases/latest
          $asset = $driver.assets | Where-Object name -Match 'win64.zip$' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\geckodriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\geckodriver.zip" "$env:RUNNER_TEMP\geckodriver"
          if (!(Test-Path 'C:\Program Files\Mozilla Firefox\firefox.exe')) { choco install firefox -y --no-progress }
      - name: 验证 AI 模型管理、冷却和界面
        shell: pwsh
        run: |
          python -X utf8 -B native/test_native.py --build "$env:RUNNER_TEMP\native-build" --runtime "$pwd\.test-output\selection-release\runtime" --core --output .test-output/core-release
          if ($LASTEXITCODE) { throw '原生核心验证失败' }
          python -X utf8 -B native/test_native.py --build "$env:RUNNER_TEMP\native-build" --runtime "$pwd\.test-output\selection-release\runtime" --ai-models --output .test-output/ui-release
          if ($LASTEXITCODE) { throw '原生界面验证失败' }
      - name: 验证 Firefox 跨组件完整选区和翻译入口
        shell: pwsh
        run: |
          python -X utf8 -B native/test_selection_firefox.py --driver "$env:RUNNER_TEMP\geckodriver\geckodriver.exe" --firefox 'C:\Program Files\Mozilla Firefox\firefox.exe' --build "$env:RUNNER_TEMP\native-build" --runtime "$pwd\.test-output\selection-release\runtime" --uia-mode 1 --case mouse-shadow-forward --case mouse-shadow-reverse --case inline-links-partial --case long-over-100k --native-copy --icon-click --output .test-output/firefox-release
          if ($LASTEXITCODE) { throw 'Firefox 完整选区验证失败' }
      - name: 保留取词测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 取词验证报告
          path: |
            .test-output/selection-release/*.json
            .test-output/selection-release/*.log
            .test-output/selection-release/native/
            .test-output/firefox-release/
            .test-output/core-release/
            .test-output/ui-release/
      - name: 保留安装包、校验值与开发验证程序
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 截图翻译原生包
          if-no-files-found: error
          path: |
            dist/release-*/*.wsplugin
            dist/release-*/*.bin
            dist/release-*/*.sha256
            dist/release-*/package.json
            ${{ runner.temp }}/native-build/native_tests.exe
      - name: 构建摘要
        shell: pwsh
        run: |
          $report = Get-Content (Get-ChildItem dist/release-*/package.json | Select-Object -First 1).FullName -Raw | ConvertFrom-Json
          "源码提交：$($report.sourceCommit)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256：$($report.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "安装包已生成；下载构建产物并完成独立桌面验证后，再发布正式 Release。旧版附件不会覆盖。" >> $env:GITHUB_STEP_SUMMARY
