name: 兼容性回归

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装旧版回归测试依赖
        run: python -m pip install -r requirements.txt
      - name: 检查协议、渠道与独立桌面界面回归
        run: python -B -m unittest discover -s .tests -v
